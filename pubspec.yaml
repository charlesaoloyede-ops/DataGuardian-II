name: data_guardian
description: "Know where your data goes — per-app mobile & Wi-Fi usage with alerts."
publish_to: "none"
version: 1.4.0+5

environment:
  sdk: "^3.4.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Local storage
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # Notifications & background
  # Background usage monitoring runs natively via Android WorkManager
  # (see android/.../monitor/UsageMonitorWorker.kt), so no Dart background
  # service package is needed.
  flutter_local_notifications: ^17.2.2

  # DI
  get_it: ^7.7.0
  injectable: ^2.4.2

  # Navigation
  go_router: ^14.2.7

  # Charts
  fl_chart: ^0.68.0

  # Code generation helpers
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Permissions
  permission_handler: ^11.3.1
  firebase_core: ^4.11.0
  firebase_analytics: ^12.4.3
  cloud_firestore: ^6.6.0
  firebase_auth: ^6.5.4

  # Top Up (airtime & data purchase)
  dio: ^5.7.0                      # HTTP client for the Cloudflare Worker
  webview_flutter: ^4.10.0         # Paystack checkout
  share_plus: ^10.1.4              # shareable receipts
  flutter_contacts: ^1.1.9         # optional contact picker for recipient
  flutter_secure_storage: ^9.2.4   # transaction PIN hash
  crypto: ^3.0.6                   # PIN hashing

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Code generators
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  injectable_generator: ^2.4.1
  freezed: ^2.5.2
  json_serializable: ^6.8.0

  # Testing
  mocktail: ^1.0.4

  # Dev tools
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
